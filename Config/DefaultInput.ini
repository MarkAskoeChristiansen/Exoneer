; Exoneer input notes
; ============================================================
; The real bindings are defined as Enhanced Input assets in the
; UE5 Editor (see README "Editor Setup" section). This .ini is
; kept minimal because Enhanced Input does not use legacy
; ActionMappings / AxisMappings.
;
; Recommended IA_/IMC_ assets to create in Editor:
;   IA_Move           Axis2D
;   IA_Look           Axis2D
;   IA_Jump           Digital
;   IA_Sprint         Digital (hold)
;   IA_Crouch         Digital (toggle)
;   IA_Interact       Digital
;   IA_PrimaryAction  Digital
;   IA_SecondaryAction Digital
;   IA_OpenInventory  Digital
;   IA_OpenBuildMenu  Digital
;   IA_RotateBlock    Digital
;   IA_ConfirmPlace   Digital
;   IA_CancelPlace    Digital
;   IA_ToggleTool     Digital
;   IA_EnterExitCockpit Digital
;
; Wire them into IMC_PlayerDefault and assign to APlayerSurvivalCharacter
; on the BP_PlayerSurvivalCharacter Blueprint.

[/Script/Engine.InputSettings]
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
